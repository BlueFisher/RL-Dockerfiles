  nginx:
    image: nginx:1.23.2
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /docker-data/nginx/nc_nginx.conf:/etc/nginx/conf.d/nc_nginx.conf:ro
      - /docker-data/nginx/gitlab_nginx.conf:/etc/nginx/conf.d/gitlab_nginx.conf:ro
      - /docker-data/nginx/only_nginx.conf:/etc/nginx/conf.d/only_nginx.conf:ro
#      - /docker-data/nginx/overleaf_nginx.conf:/etc/nginx/conf.d/overleaf_nginx.conf:ro
      - /home/n705/nc.n705.work_nginx:/etc/nginx/certs/nc.n705.work_nginx/:ro
      - /home/n705/gitlab.n705.work_nginx:/etc/nginx/certs/gitlab.n705.work_nginx/:ro
      - /home/n705/only.n705.work_nginx:/etc/nginx/certs/only.n705.work_nginx/:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
