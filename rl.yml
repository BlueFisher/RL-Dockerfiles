apiVersion: apps/v1
kind: Deployment
metadata:
  name: rl
  namespace: n705
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rl
  template:
    metadata:
      labels:
        app: rl
    spec:
      hostname: rl
      nodeSelector:
        kubernetes.io/hostname: n705-1
      containers:
      - name: rl
        image: rl:7.3-12.2.0
        env:
          - name: NOVNC_ENABLE
            value: 'true'
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: volume-6i2q8m
          mountPath: /data
        - mountPath: /dev/shm
          name: dshm
      volumes:
      - name: volume-6i2q8m
        persistentVolumeClaim:
          claimName: n705-pvc
      - name: dshm
        emptyDir:
          medium: Memory
